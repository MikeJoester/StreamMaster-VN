<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamMaster Remote Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-bottom: 50px; }
        .tab-content { padding: 20px; background: white; border: 1px solid #dee2e6; border-top: none; border-radius: 0 0 .25rem .25rem; }
        .sticky-save { position: fixed; top: 10px; right: 10px; z-index: 1000; }
        .match-card { border: 1px solid #eee; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .match-title { font-weight: bold; font-size: 0.9rem; color: #666; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>StreamMaster</h1>
            <button class="btn btn-primary" onclick="saveAll()">Save All Changes</button>
        </div>

        <ul class="nav nav-tabs" id="masterTabs" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-scoreboard">Scoreboard</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-vs">VS Screen</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-winner">Winner</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-bracket">Bracket Players</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-control">Bracket Control</button></li>
        </ul>

        <div class="tab-content">
            <!-- Scoreboard -->
            <div class="tab-pane fade show active" id="tab-scoreboard">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Event Name</label>
                        <input type="text" class="form-control" id="event-name">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Best of / Info</label>
                        <input type="text" class="form-control" id="event-bestof">
                    </div>
                    <hr>
                    <div class="col-md-6">
                        <h5>Player 1</h5>
                        <input type="text" class="form-control mb-2" id="sb-p1-name" placeholder="Name">
                        <input type="text" class="form-control mb-2" id="sb-p1-team" placeholder="Team">
                        <input type="number" class="form-control mb-2" id="sb-p1-score" placeholder="Score">
                        <input type="text" class="form-control mb-2" id="sb-p1-country" placeholder="Country (US, JP, etc.)">
                    </div>
                    <div class="col-md-6">
                        <h5>Player 2</h5>
                        <input type="text" class="form-control mb-2" id="sb-p2-name" placeholder="Name">
                        <input type="text" class="form-control mb-2" id="sb-p2-team" placeholder="Team">
                        <input type="number" class="form-control mb-2" id="sb-p2-score" placeholder="Score">
                        <input type="text" class="form-control mb-2" id="sb-p2-country" placeholder="Country">
                    </div>
                </div>
            </div>

            <!-- VS Screen -->
            <div class="tab-pane fade" id="tab-vs">
                <div class="row g-3">
                    <div class="col-md-6">
                        <h5>Player 1</h5>
                        <input type="text" class="form-control mb-2" id="vs-p1-name" placeholder="Name">
                        <select class="form-select" id="vs-p1-char">
                            {% for char in characters %}<option value="{{ char }}">{{ char }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <h5>Player 2</h5>
                        <input type="text" class="form-control mb-2" id="vs-p2-name" placeholder="Name">
                        <select class="form-select" id="vs-p2-char">
                            {% for char in characters %}<option value="{{ char }}">{{ char }}</option>{% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <!-- Winner -->
            <div class="tab-pane fade" id="tab-winner">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">Winner Name</label>
                        <input type="text" class="form-control mb-2" id="win-name">
                        <label class="form-label">Team</label>
                        <input type="text" class="form-control mb-2" id="win-team">
                        <label class="form-label">Country</label>
                        <input type="text" class="form-control mb-2" id="win-country">
                        <label class="form-label">Character</label>
                        <select class="form-select" id="win-char">
                            {% for char in characters %}<option value="{{ char }}">{{ char }}</option>{% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <!-- Bracket Players -->
            <div class="tab-pane fade" id="tab-bracket">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>Player List</h4>
                    <button class="btn btn-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#bulkAddModal">Bulk Add Players</button>
                </div>
                <div class="row" id="bracket-players-container">
                    <!-- JS populated -->
                </div>
            </div>

            <!-- Bracket Control -->
            <div class="tab-pane fade" id="tab-control">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="gf-reset-enable" onchange="toggleReset()">
                        <label class="form-check-label">Enable Grand Final Reset</label>
                    </div>
                    <button class="btn btn-danger btn-sm" onclick="resetScores()">Reset All Scores</button>
                </div>
                <div id="matches-container">
                    <div class="row">
                        <div class="col-md-6">
                            <h5>Winners Bracket</h5>
                            <div id="winners-matches"></div>
                        </div>
                        <div class="col-md-6">
                            <h5>Losers Bracket</h5>
                            <div id="losers-matches"></div>
                        </div>
                    </div>
                    <div class="row mt-4">
                        <div class="col-12">
                            <h5>Finals</h5>
                            <div id="finals-matches"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bulk Add Modal -->
    <div class="modal fade" id="bulkAddModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Bulk Add Players</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="small text-muted">Enter player names, one per line. This will overwrite the names of the current players in order.</p>
                    <textarea class="form-control" id="bulk-player-names" rows="10" placeholder="Player 1&#10;Player 2&#10;..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="applyBulkAdd()">Apply</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let appData = {};
        const characters = {{ characters | tojson }};

        function applyBulkAdd() {
            const lines = document.getElementById('bulk-player-names').value.split('\n').map(l => l.trim()).filter(l => l !== '');
            if (lines.length === 0) return;

            lines.forEach((name, i) => {
                if (appData.bracket.players[i]) {
                    appData.bracket.players[i].name = name;
                }
            });

            // Close modal
            const modalEl = document.getElementById('bulkAddModal');
            const modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();

            // Refresh UI
            populateUI();
            
            // Clear textarea
            document.getElementById('bulk-player-names').value = '';
            
            alert('Players updated! Don\'t forget to click "Save All Changes" to persist.');
        }

        async function resetScores() {
            if (!confirm('Are you sure you want to reset ALL scores to 0? This includes the bracket and the active scoreboard.')) return;
            
            // Reset scoreboard inputs
            document.getElementById('sb-p1-score').value = 0;
            document.getElementById('sb-p2-score').value = 0;
            
            // Reset match score inputs
            document.querySelectorAll('.m-score').forEach(el => el.value = 0);
            
            // Save changes
            await saveAll();
        }

        async function loadData() {
            const resp = await fetch('/api/data');
            appData = await resp.json();
            populateUI();
        }

        function populateUI() {
            // Scoreboard
            document.getElementById('event-name').value = appData.event.name;
            document.getElementById('event-bestof').value = appData.event.best_of;
            document.getElementById('sb-p1-name').value = appData.scoreboard.p1.name;
            document.getElementById('sb-p1-team').value = appData.scoreboard.p1.team;
            document.getElementById('sb-p1-score').value = appData.scoreboard.p1.score;
            document.getElementById('sb-p1-country').value = appData.scoreboard.p1.country;
            document.getElementById('sb-p2-name').value = appData.scoreboard.p2.name;
            document.getElementById('sb-p2-team').value = appData.scoreboard.p2.team;
            document.getElementById('sb-p2-score').value = appData.scoreboard.p2.score;
            document.getElementById('sb-p2-country').value = appData.scoreboard.p2.country;

            // VS
            document.getElementById('vs-p1-name').value = appData.vs.p1.name;
            document.getElementById('vs-p1-char').value = appData.vs.p1.character;
            document.getElementById('vs-p2-name').value = appData.vs.p2.name;
            document.getElementById('vs-p2-char').value = appData.vs.p2.character;

            // Winner
            document.getElementById('win-name').value = appData.winner.winner;
            document.getElementById('win-team').value = appData.winner.team;
            document.getElementById('win-country').value = appData.winner.country;
            document.getElementById('win-char').value = appData.winner.character;

            // Bracket Players
            const playersCont = document.getElementById('bracket-players-container');
            playersCont.innerHTML = '';
            appData.bracket.players.forEach((p, i) => {
                const col = document.createElement('div');
                col.className = 'col-md-6 mb-3 p-3 border rounded';
                col.innerHTML = `
                    <h6>Player ${i+1}</h6>
                    <input type="text" class="form-control mb-1 bp-name" data-idx="${i}" value="${p.name}" placeholder="Name">
                    <input type="text" class="form-control mb-1 bp-team" data-idx="${i}" value="${p.team}" placeholder="Team">
                    <input type="text" class="form-control mb-1 bp-country" data-idx="${i}" value="${p.country}" placeholder="Country">
                    <select class="form-select bp-char" data-idx="${i}">
                        ${characters.map(c => `<option value="${c}" ${c === p.character ? 'selected' : ''}>${c}</option>`).join('')}
                    </select>
                `;
                playersCont.appendChild(col);
            });

            // Bracket Control
            renderMatches();
        }

        function getParticipantName(participant) {
            if (!participant) return "TBD";
            if (participant.type === 'player') {
                return appData.bracket.players[participant.index]?.name || "TBD";
            }
            // Resolve match result recursively
            return resolveParticipantName(participant);
        }

        function resolveParticipantName(participant) {
            let p = resolveParticipant(participant);
            return p ? p.name : "TBD";
        }

        function resolveParticipant(part) {
            if (!part) return null;
            if (part.type === 'player') return appData.bracket.players[part.index];
            
            let match;
            if (part.matchId in appData.bracket.matches.winners) match = appData.bracket.matches.winners[part.matchId];
            else if (part.matchId in appData.bracket.matches.losers) match = appData.bracket.matches.losers[part.matchId];
            else if (part.matchId === 'GF') match = appData.bracket.matches.grandFinal.GF;
            
            if (!match || match.winner === null) return null;
            let side = (part.outcome === 'winner') ? match.winner : (match.winner === 1 ? 2 : 1);
            return resolveParticipant(match.participants[side-1]);
        }

        function createMatchHTML(id, type, data) {
            const p1 = getParticipantName(data.participants[0]);
            const p2 = getParticipantName(data.participants[1]);
            const typeLabel = type.charAt(0).toUpperCase() + type.slice(1);
            return `
                <div class="match-card">
                    <div class="match-title">${typeLabel} - ${id}</div>
                    <div class="row align-items-center">
                        <div class="col text-end">${p1}</div>
                        <div class="col-2"><input type="number" class="form-control form-control-sm m-score" data-id="${id}" data-type="${type}" data-side="1" value="${data.score1}"></div>
                        <div class="col-1 text-center">-</div>
                        <div class="col-2"><input type="number" class="form-control form-control-sm m-score" data-id="${id}" data-type="${type}" data-side="2" value="${data.score2}"></div>
                        <div class="col">${p2}</div>
                    </div>
                </div>
            `;
        }

        function renderMatches() {
            const winnersCont = document.getElementById('winners-matches');
            const losersCont = document.getElementById('losers-matches');
            const finalsCont = document.getElementById('finals-matches');
            
            winnersCont.innerHTML = '';
            losersCont.innerHTML = '';
            finalsCont.innerHTML = '';

            // Column 1: Winners - WSF1, WSF2, WF
            ['WSF1', 'WSF2', 'WF'].forEach(id => {
                if (appData.bracket.matches.winners[id]) {
                    winnersCont.innerHTML += createMatchHTML(id, 'winners', appData.bracket.matches.winners[id]);
                }
            });

            // Column 2: Losers - LQF1, LQF2, LSF1, LSF2
            ['LQF1', 'LQF2', 'LSF1', 'LSF2'].forEach(id => {
                if (appData.bracket.matches.losers[id]) {
                    losersCont.innerHTML += createMatchHTML(id, 'losers', appData.bracket.matches.losers[id]);
                }
            });

            // Final Column: LF, LL, GF
            ['LF', 'LL'].forEach(id => {
                if (appData.bracket.matches.losers[id]) {
                    finalsCont.innerHTML += createMatchHTML(id, 'losers', appData.bracket.matches.losers[id]);
                }
            });
            
            finalsCont.innerHTML += createMatchHTML('GF', 'grandFinal', appData.bracket.matches.grandFinal.GF);

            if (appData.bracket.matches.grandFinal.GF.resetMatch) {
                finalsCont.innerHTML += createMatchHTML('Reset', 'reset', appData.bracket.matches.grandFinal.GF.resetMatch);
                document.getElementById('gf-reset-enable').checked = true;
            } else {
                document.getElementById('gf-reset-enable').checked = false;
            }
        }

        function toggleReset() {
            const enabled = document.getElementById('gf-reset-enable').checked;
            if (enabled) {
                if (!appData.bracket.matches.grandFinal.GF.resetMatch) {
                    appData.bracket.matches.grandFinal.GF.resetMatch = {
                        participants: [
                            {type: "match", matchId: "WF", outcome: "winner"},
                            {type: "match", matchId: "LL", outcome: "winner"}
                        ],
                        score1: 0, score2: 0, winner: null
                    };
                }
            } else {
                appData.bracket.matches.grandFinal.GF.resetMatch = null;
            }
            renderMatches();
        }

        async function saveAll() {
            // Update appData from UI
            appData.event.name = document.getElementById('event-name').value;
            appData.event.best_of = document.getElementById('event-bestof').value;
            
            appData.scoreboard.p1 = {
                name: document.getElementById('sb-p1-name').value,
                team: document.getElementById('sb-p1-team').value,
                score: parseInt(document.getElementById('sb-p1-score').value || 0),
                country: document.getElementById('sb-p1-country').value
            };
            appData.scoreboard.p2 = {
                name: document.getElementById('sb-p2-name').value,
                team: document.getElementById('sb-p2-team').value,
                score: parseInt(document.getElementById('sb-p2-score').value || 0),
                country: document.getElementById('sb-p2-country').value
            };

            appData.vs.p1 = { name: document.getElementById('vs-p1-name').value, character: document.getElementById('vs-p1-char').value };
            appData.vs.p2 = { name: document.getElementById('vs-p2-name').value, character: document.getElementById('vs-p2-char').value };

            appData.winner = {
                winner: document.getElementById('win-name').value,
                team: document.getElementById('win-team').value,
                country: document.getElementById('win-country').value,
                character: document.getElementById('win-char').value
            };

            // Bracket Players
            document.querySelectorAll('.bp-name').forEach(el => appData.bracket.players[el.dataset.idx].name = el.value);
            document.querySelectorAll('.bp-team').forEach(el => appData.bracket.players[el.dataset.idx].team = el.value);
            document.querySelectorAll('.bp-country').forEach(el => appData.bracket.players[el.dataset.idx].country = el.value);
            document.querySelectorAll('.bp-char').forEach(el => appData.bracket.players[el.dataset.idx].character = el.value);

            // Match Scores
            document.querySelectorAll('.m-score').forEach(el => {
                const id = el.dataset.id;
                const type = el.dataset.type;
                const side = el.dataset.side;
                const val = parseInt(el.value || 0);
                
                let m;
                if (type === 'winners') m = appData.bracket.matches.winners[id];
                else if (type === 'losers') m = appData.bracket.matches.losers[id];
                else if (type === 'grandFinal') m = appData.bracket.matches.grandFinal.GF;
                else if (type === 'reset') m = appData.bracket.matches.grandFinal.GF.resetMatch;
                
                if (m) {
                    if (side === "1") m.score1 = val;
                    else m.score2 = val;
                    
                    if (m.score1 > m.score2) m.winner = 1;
                    else if (m.score2 > m.score1) m.winner = 2;
                    else m.winner = null;
                }
            });

            const resp = await fetch('/api/data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(appData)
            });
            
            if (resp.ok) {
                alert('Saved successfully!');
                loadData(); // Reload to refresh TBD names
            } else {
                alert('Error saving data');
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>

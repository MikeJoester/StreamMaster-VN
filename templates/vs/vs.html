<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../styles/style.css">
    <style>
        body {
            background-color: black;
            background-image: none;
        }
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1; /* Lowest layer */
        }
        .background-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2; /* Above video */
        }
        .player {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .character-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .player-name {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: 12px 24px;
            border-radius: 12px;
            white-space: nowrap;
            font-weight: bold;
            font-size: 48px;
            text-align: center;
        }
        .vs {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 280px;
            font-weight: bold;
            padding: 20px 40px;
            border-radius: 20px;
            z-index: 3;
            white-space: nowrap;
        }
    </style>
    <script>
        async function loadData() {
            try {
                const resp = await fetch('../../data.json');
                const data = await resp.json();
                document.getElementById('p1Name').innerText = data.vs.p1.name;
                document.getElementById('p2Name').innerText = data.vs.p2.name;
                const p1Char = data.vs.p1.character.toLowerCase().replace(/[ .]/g, '');
                const p2Char = data.vs.p2.character.toLowerCase().replace(/[ .]/g, '');
                document.getElementById('p1Char').src = `../../images/characters/${p1Char}.png`;
                document.getElementById('p2Char').src = `../../images/characters/${p2Char}.png`;

                resizeTextToFit(document.getElementById('p1Name'), 20, 72);
                resizeTextToFit(document.getElementById('p2Name'), 20, 72);
            } catch(e) { console.error(e); }
        }

        function resizeTextToFit(element, minFontSize, maxFontSize) {
            if (!element) return;
            const containerWidth = element.parentElement.clientWidth;
            let fontSize = maxFontSize;
            element.style.fontSize = fontSize + 'px';
            while (element.scrollWidth > containerWidth * 0.9 && fontSize > minFontSize) {
                fontSize -= 1;
                element.style.fontSize = fontSize + 'px';
            }
        }

        setInterval(loadData, 1000);
        window.onload = loadData;
    </script>
</head>
<body>
    <div class="video-background">
        <video class="background-video" autoplay loop muted playsinline>
            <source src="../../images/versus.mp4" type="video/mp4">
        </video>
    </div>
    <div class="container">
        <div class="player">
            <img id="p1Char" class="character-img" alt="Character">
            <div class="player-name" id="p1Name"></div>
        </div>
        <div class="vs">VS</div>
        <div class="player">
            <img id="p2Char" class="character-img" alt="Character">
            <div class="player-name" id="p2Name"></div>
        </div>
    </div>
</body>
</html>
